<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MediaPipe Hand Tracker Web</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #1a1a1a;
    }
    .video-container {
      position: relative;
      width: 640px;
      height: 480px;
    }
    /* Mirror the feed horizontally for a natural selfie-view */
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); 
    }
  </style>
</head>
<body>

  <div class="video-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <script type="module">
    import {
        HandLandmarker,
        FilesetResolver,
        DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs";

    const video = document.getElementById("webcam");
    const canvasElement = document.getElementById("output_canvas");
    const canvasCtx = canvasElement.getContext("2d");
    
    let handLandmarker;
    let lastVideoTime = -1;

    // 1. Initialize the HandLandmarker model
    async function initializeHandTracker() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
      );
      
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          // Uses the exact same model file as your Python script
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2,
        minHandDetectionConfidence: 0.5,
        minHandPresenceConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      
      startWebcam();
    }

    // 2. Request webcam access and start the video feed
    async function startWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.addEventListener("loadeddata", predictWebcam);
      } catch (err) {
        console.error("Webcam access denied or unavailable.", err);
      }
    }

    // 3. The detection and drawing loop
    async function predictWebcam() {
      // Ensure the video is playing and a new frame is ready
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        
        // Detect hands in the current video frame
        const results = handLandmarker.detectForVideo(video, performance.now());
        
        // Clear the canvas for the new frame
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        
        // Draw landmarks if hands are detected
        if (results.landmarks) {
          const drawingUtils = new DrawingUtils(canvasCtx);
          for (const landmarks of results.landmarks) {
            // Draw connections (bones)
            drawingUtils.drawConnectors(landmarks, HandLandmarker.HAND_CONNECTIONS, {
              color: "#00FF00", lineWidth: 2
            });
            // Draw joints
            drawingUtils.drawLandmarks(landmarks, {
              color: "#FF0000", lineWidth: 2, radius: 4
            });
          }
        }
        canvasCtx.restore();
      }
      
      // Loop continuously
      requestAnimationFrame(predictWebcam);
    }

    // Start the application
    initializeHandTracker();
  </script>
</body>
</html>
