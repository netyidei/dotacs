<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dotacs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #e8ecf3;
      --surface: #f8f9fc;
      --ink: #13151f;
      --ink-2: #1c1f2c;
      --muted: #5d6475;
      --line: #cfd5e1;
      --cobalt: #3346ff;
      --cobalt-soft: #dfe3ff;
      --marigold: #ffb319;
      --coral: #ff5a4d;
      --font: "Bricolage Grotesque", "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font);
      font-variation-settings: "wdth" 92;
    }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }

    /* ---------- page frame ---------- */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px 0;
      max-width: 1240px;
      margin: 0 auto;
    }
    .brand {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand .mark {
      width: 22px; height: 22px;
      border-radius: 50% 50% 50% 6px;
      background: var(--cobalt);
      box-shadow: 9px -7px 0 -4px var(--marigold);
    }
    #status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px 6px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 0.9rem;
      color: var(--muted);
    }
    #status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    #status[data-tone="ok"] i { background: #22a06b; }
    #status[data-tone="error"] i { background: var(--coral); }
    #status[data-tone="busy"] i { background: var(--marigold); }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 680px) minmax(300px, 1fr);
      gap: 28px;
      max-width: 1240px;
      margin: 0 auto;
      padding: 20px 32px 40px;
      align-items: start;
    }

    /* ---------- stage: video + live captions in one slab ---------- */
    .stage {
      background: var(--ink);
      border-radius: 22px;
      padding: 10px;
      box-shadow: 0 24px 50px -28px rgba(19, 21, 31, 0.7);
    }
    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* Mirror effect */
    }
    .hud {
      position: absolute;
      top: 12px;
      display: flex;
      gap: 8px;
      pointer-events: none;
    }
    .hud.left { left: 12px; }
    .hud.right { right: 12px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 11px 4px 9px;
      border-radius: 999px;
      background: rgba(19, 21, 31, 0.68);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 0.82rem;
    }
    .chip i { width: 7px; height: 7px; border-radius: 50%; background: #7b8194; }
    .chip[data-on="1"] i { background: var(--marigold); }
    #motion-chip[data-on="1"] i { background: #8fa0ff; box-shadow: 0 0 0 4px rgba(143, 160, 255, 0.35); }

    #motion-toast {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 8px 20px;
      border-radius: 12px;
      background: var(--marigold);
      color: var(--ink);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      opacity: 0;
      pointer-events: none;
    }
    #motion-toast.show { animation: toast 1.5s ease-out; }
    @keyframes toast {
      0%   { opacity: 0; transform: translate(-50%, 10px) scale(0.92); }
      12%  { opacity: 1; transform: translate(-50%, 0) scale(1); }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* captions */
    .captions { padding: 18px 10px 6px; }
    .sentence {
      min-height: 4.2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 8px;
      align-content: flex-start;
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: #fff;
    }
    .sentence .placeholder { color: rgba(255, 255, 255, 0.45); font-weight: 400; font-size: 1.15rem; letter-spacing: 0; }
    .tok { padding: 4px 12px 6px; border-radius: 10px; }
    .tok.whole { background: var(--cobalt); }
    .tok.spelled { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.4); }
    .tok.live { color: var(--marigold); box-shadow: inset 0 0 0 2px var(--marigold); letter-spacing: 0.04em; }
    .tok.live::after {
      content: "";
      display: inline-block;
      width: 3px; height: 1.05em;
      margin-left: 4px;
      vertical-align: -0.12em;
      background: var(--marigold);
      animation: blink 1s steps(2, start) infinite;
    }
    @keyframes blink { to { visibility: hidden; } }
    .tok.pop { animation: pop 0.28s ease-out; }
    @keyframes pop { from { transform: scale(0.85); } to { transform: scale(1); } }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 10px 8px; }
    .actions button {
      padding: 7px 15px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 0.92rem;
    }
    .actions button:hover { background: rgba(255, 255, 255, 0.1); }
    .actions button.primary { background: var(--marigold); border-color: var(--marigold); color: var(--ink); font-weight: 600; }
    .actions button.primary:hover { background: #ffc447; }
    .actions button:disabled { opacity: 0.4; cursor: not-allowed; }
    .actions .spacer { flex: 1; }

    /* ---------- side column ---------- */
    .side { display: grid; gap: 20px; }

    .readout {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
    }
    .ring { position: relative; width: 68px; height: 68px; flex: none; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 5; }
    .ring .track { stroke: var(--line); }
    .ring #ring-fg { stroke: var(--cobalt); stroke-linecap: round; transition: stroke-dashoffset 0.08s linear; }
    .ring[data-done="1"] #ring-fg { stroke: #22a06b; }
    .ring.flash { animation: flash 0.45s ease-out; }
    @keyframes flash { 0% { transform: scale(1.14); } 100% { transform: scale(1); } }

    #text-output {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: #22a06b;
      overflow-wrap: anywhere;
    }
    #text-output[data-state="unknown"] { color: #d9731c; }
    #text-output[data-state="none"] { color: #98a0b3; }
    #text-output[data-state="idle"] { color: var(--ink); }
    #readout-hint { margin-top: 5px; color: var(--muted); font-size: 0.95rem; min-height: 1.2em; }

    .guide {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }
    .guide-head { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 20px 0; }
    .guide-head h2 { margin: 0; font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; }
    .tabs { display: flex; gap: 18px; }
    .tabs button {
      background: none; border: 0; padding: 0 0 8px; cursor: pointer;
      color: var(--muted);
      border-bottom: 3px solid transparent;
    }
    .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--cobalt); font-weight: 600; }
    #guide-body {
      padding: 14px 14px 16px;
      max-height: 430px;
      overflow-y: auto;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 8px;
      align-content: start;
    }
    .tile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #fff;
      border: 1px solid var(--line);
      min-width: 0;
    }
    .tile .glyph {
      flex: none;
      min-width: 30px;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--cobalt);
      text-align: center;
    }
    .tile .glyph.word { font-size: 0.98rem; text-align: left; min-width: 0; color: var(--ink); }
    .tile .how { font-size: 0.8rem; line-height: 1.25; color: var(--muted); }
    .tile.motion { border-left: 4px solid var(--marigold); }
    .tile.pair { border-left: 4px solid var(--cobalt); }
    .tile.live { background: var(--cobalt-soft); border-color: var(--cobalt); }
    .legend { padding: 0 20px 12px; font-size: 0.82rem; color: var(--muted); display: flex; gap: 16px; }
    .legend span::before {
      content: ""; display: inline-block; width: 4px; height: 12px; margin-right: 6px; vertical-align: -2px; border-radius: 2px;
    }
    .legend .l-motion::before { background: var(--marigold); }
    .legend .l-pair::before { background: var(--cobalt); }

    @media (max-width: 980px) {
      .layout { grid-template-columns: minmax(0, 1fr); padding: 16px 16px 32px; }
      .top { padding: 16px 16px 0; }
      .sentence { font-size: 1.4rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <header class="top">
    <div class="brand"><span class="mark"></span>dotacs</div>
    <div id="status" data-tone="busy"><i></i><span>Loading model...</span></div>
  </header>

  <main class="layout">
    <section class="stage">
      <div class="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
        <div class="hud left"><span class="chip" id="hand-chip" data-on="0"><i></i><span>No hand</span></span></div>
        <div class="hud right"><span class="chip" id="motion-chip" data-on="0"><i></i><span>Still</span></span></div>
        <div id="motion-toast" aria-hidden="true"></div>
      </div>

      <div class="captions">
        <div id="sentence" class="sentence" aria-live="polite"></div>
      </div>
      <div class="actions">
        <button id="btn-speak" class="primary" title="Read the sentence aloud (Enter)">Speak</button>
        <button id="btn-space" title="Finish the word you are spelling (Space)">Next word</button>
        <button id="btn-back" title="Remove the last letter or word (Backspace)">Undo</button>
        <button id="btn-copy" title="Copy the sentence as text">Copy</button>
        <span class="spacer"></span>
        <button id="btn-clear" title="Start over (Escape)">Clear</button>
      </div>
    </section>

    <section class="side">
      <div class="readout">
        <div class="ring" id="ring" data-done="0">
          <svg viewBox="0 0 44 44" aria-hidden="true">
            <circle class="track" cx="22" cy="22" r="18"></circle>
            <circle id="ring-fg" cx="22" cy="22" r="18"></circle>
          </svg>
        </div>
        <div>
          <div id="text-output" data-state="idle">Loading model...</div>
          <div id="readout-hint"></div>
        </div>
      </div>

      <div class="guide">
        <div class="guide-head">
          <h2>Sign guide</h2>
          <div class="tabs" role="tablist">
            <button role="tab" data-tab="letters" aria-selected="true">Letters and numbers</button>
            <button role="tab" data-tab="words" aria-selected="false">Words</button>
          </div>
        </div>
        <div class="legend" id="legend" hidden>
          <span class="l-motion">Motion</span>
          <span class="l-pair">Two hands</span>
        </div>
        <div id="guide-body"></div>
      </div>
    </section>
  </main>

  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs";

    const $ = (id) => document.getElementById(id);
    const video = $("webcam");
    const canvasElement = $("output_canvas");
    const canvasCtx = canvasElement.getContext("2d");
    const textOutput = $("text-output");
    const readoutHint = $("readout-hint");
    const ringEl = $("ring");
    const ringFg = $("ring-fg");
    const statusEl = $("status");
    const handChip = $("hand-chip");
    const motionChip = $("motion-chip");
    const motionToast = $("motion-toast");
    const sentenceEl = $("sentence");
    const guideBody = $("guide-body");

    // Add ?debug to the page URL to print feature values and motion analysis to the console.
    const DEBUG = new URLSearchParams(location.search).has("debug");

    // ------------------------------------------------------------------
    // Tunable settings
    // ------------------------------------------------------------------
    const CONFIG = {
      // static hand shape
      smoothing: 0.55,
      stableFrames: 4,
      handLostGraceMs: 350,
      fingerAngle: { min: 100, max: 165 },
      fingerOn: 0.60,
      fingerOff: 0.35,
      thumbAcrossOn: 0.38,
      thumbAcrossOff: 0.50,
      thumbOut: 0.85,
      touch: 0.30,
      spreadApart: 1.5,
      curvedAvg: { min: 0.15, max: 0.70 },

      // which hand types letters and one-hand words when both hands are in view
      // (two-hand signs are checked first). "auto" = the hand that appeared first,
      // "left" / "right" = the hand on that side of the screen as you see it.
      leadHand: "auto",

      // adding signs to the sentence
      hold: {
        holdMs: 700,        // hold a still sign this long to add it
        repeatMs: 1500,     // keep holding a letter this long to type it again (double letters)
        wordGapMs: 2200,    // pause this long and the spelled letters become a word
        stillSpeed: 0.8,    // palm lengths/second; faster than this counts as moving
        afterMotionMs: 1500 // ignore held shapes right after a motion sign
      },

      // one-hand motion (all distances are in palm lengths, so they work at any distance)
      motion: {
        startSpeed: 1.0,
        stopSpeed: 0.5,
        stopMs: 220,
        minMs: 280,
        maxMs: 2600,
        minPath: 0.8,
        swingAmp: 0.3,                 // smallest back-and-forth stroke that counts
        minCircleTurn: 1.5 * Math.PI,  // about 270 degrees
        minSwipe: 1.0,
        repeatBlockMs: 1800            // ignore the same motion sign repeating this soon
      },

      // finger flapping (bye, come here)
      flap: { windowMs: 1600, minCloses: 2, high: 0.65, low: 0.35, maxSpeed: 0.8, cooldownMs: 1500 },

      // path templates (J, Z)
      template: { points: 32, maxDist: 0.22 },

      // two-hand motion
      pair: {
        windowMs: 1500,
        altRange: 0.5,      // each hand must travel at least this far vertically (6-7)
        altAmp: 0.25,       // smallest up/down stroke that counts (6-7)
        altCorr: -0.35,     // how opposite the two hands' vertical motion must be (-1 = perfectly)
        clapAmp: 0.5,       // smallest in/out stroke of the gap between hands (clap)
        clapRange: 1.0,
        moveDelta: 1.0,     // gap change for "apart" / "together"
        cooldownMs: 1800,
        gapOverlap: 0.7,    // palm distance (in palm lengths) below this = hands overlap
        gapNear: 1.8        // ...below this = near, otherwise far
      }
    };

    const UNKNOWN = "Unknown Gesture";
    const NOHAND = "No hand detected";

    let handLandmarker;
    let lastVideoTime = -1;
    let gestureDictionary = {};

    // ------------------------------------------------------------------
    // Status helpers
    // ------------------------------------------------------------------
    function setStatus(text, tone) {
      statusEl.dataset.tone = tone;
      statusEl.querySelector("span").textContent = text;
    }

    // ------------------------------------------------------------------
    // Loading
    // ------------------------------------------------------------------
    const RESERVED = new Set(["motions", "pairs"]);

    function normRule(r) {
      if (typeof r === "string") r = { label: r };
      const say = r.say ?? r.label;
      const kind = r.kind ?? (/^[A-Za-z]$/.test(say) ? "letter" : /^\d$/.test(say) ? "number" : "word");
      return Object.assign(r, { say, kind });
    }

    function normalizeDictionary(dict) {
      const motions = (dict.motions || []).map(normRule);
      const pairs = (dict.pairs || []).map(normRule);
      for (const key of Object.keys(dict)) {
        if (RESERVED.has(key)) continue;
        const v = dict[key];
        dict[key] = (Array.isArray(v) ? v : [v]).map(normRule);
      }
      dict.motions = motions;
      dict.pairs = pairs;
      return dict;
    }

    async function loadGestures() {
      try {
        const response = await fetch('gestures.json');
        gestureDictionary = normalizeDictionary(await response.json());
        return true;
      } catch (err) {
        console.error("Could not load gestures.json (serve the folder over http, not file://)", err);
        textOutput.innerText = "Error loading JSON";
        textOutput.dataset.state = "unknown";
        setStatus("gestures.json failed to load", "error");
        return false;
      }
    }

    async function initializeHandTracker() {
      if (!(await loadGestures())) return;
      buildGuide();
      renderSentence();

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
      );

      const options = (delegate) => ({
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate
        },
        runningMode: "VIDEO",
        numHands: 2,
        minHandDetectionConfidence: 0.6,
        minHandPresenceConfidence: 0.6,
        minTrackingConfidence: 0.6
      });

      try {
        handLandmarker = await HandLandmarker.createFromOptions(vision, options("GPU"));
      } catch (err) {
        console.warn("GPU delegate unavailable, falling back to CPU", err);
        handLandmarker = await HandLandmarker.createFromOptions(vision, options("CPU"));
      }

      startWebcam();
    }

    async function startWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 640 },
            height: { ideal: 480 },
            frameRate: { ideal: 30 },
            facingMode: "user"
          }
        });
        video.srcObject = stream;
        video.addEventListener("loadeddata", predictWebcam);
        textOutput.innerText = "Show a gesture";
        textOutput.dataset.state = "idle";
        setStatus("Camera on", "ok");
      } catch (err) {
        textOutput.innerText = "Camera access denied";
        textOutput.dataset.state = "unknown";
        setStatus("Camera access denied", "error");
      }
    }

    // ------------------------------------------------------------------
    // Geometry helpers
    // ------------------------------------------------------------------
    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    const d3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);

    function angleAt(a, b, c) {
      const ux = a.x - b.x, uy = a.y - b.y, uz = a.z - b.z;
      const vx = c.x - b.x, vy = c.y - b.y, vz = c.z - b.z;
      const dot = ux * vx + uy * vy + uz * vz;
      const mag = Math.hypot(ux, uy, uz) * Math.hypot(vx, vy, vz) || 1e-9;
      return Math.acos(Math.max(-1, Math.min(1, dot / mag))) * 180 / Math.PI;
    }

    function dirOf(I, a, b, vw, vh) {
      const dx = (I[b].x - I[a].x) * vw;
      const dy = (I[b].y - I[a].y) * vh;
      const deg = Math.atan2(-dy, dx) * 180 / Math.PI;
      if (deg > 45 && deg < 135) return "up";
      if (deg < -45 && deg > -135) return "down";
      return "side";
    }

    function ema(prev, cur, a) {
      if (!prev) return cur.map(p => ({ x: p.x, y: p.y, z: p.z || 0 }));
      return cur.map((p, i) => ({
        x: prev[i].x + a * (p.x - prev[i].x),
        y: prev[i].y + a * (p.y - prev[i].y),
        z: prev[i].z + a * ((p.z || 0) - prev[i].z)
      }));
    }

    function hyst(state, name, value, low, high) {
      if (value > high) state[name] = true;
      else if (value < low) state[name] = false;
      return !!state[name];
    }

    const range = (a) => Math.max(...a) - Math.min(...a);
    const mean = (a) => a.reduce((s, v) => s + v, 0) / (a.length || 1);

    function correlation(a, b) {
      const ma = mean(a), mb = mean(b);
      let num = 0, da = 0, db = 0;
      for (let i = 0; i < a.length; i++) {
        const x = a[i] - ma, y = b[i] - mb;
        num += x * y; da += x * x; db += y * y;
      }
      return num / (Math.sqrt(da * db) || 1e-9);
    }

    // ------------------------------------------------------------------
    // Per-hand state. There are two slots; a detected hand keeps its slot by
    // staying closest to where that slot's hand was last seen.
    // ------------------------------------------------------------------
    function newHand(id) {
      return {
        id, active: false, present: false, lostSince: null, appearedAt: 0, lastPalm: null,
        smoothW: null, smoothI: null, hyst: {},
        buffer: [], scaleEma: 0, speedEma: 0, speed: 0, lastMovingAt: 0,
        motion: { active: false, samples: [], stillSince: null, startCount: 0 },
        fingerHist: [], flapCooldownUntil: 0,
        landmarks: null, features: null, rule: null, sample: null
      };
    }
    const hands = [newHand(0), newHand(1)];

    // ------------------------------------------------------------------
    // Static hand-shape features
    // ------------------------------------------------------------------
    const FINGERS = {
      index:  [5, 6, 7, 8],
      middle: [9, 10, 11, 12],
      ring:   [13, 14, 15, 16],
      pinky:  [17, 18, 19, 20]
    };
    const TIPS = { index: 8, middle: 12, ring: 16, pinky: 20 };

    function extractFeatures(h, W, I, vw, vh) {
      const palm = d3(W[0], W[9]) || 1e-6;

      const score = {};
      for (const [name, [mcp, pip, dip, tip]] of Object.entries(FINGERS)) {
        const ang = angleAt(W[mcp], W[pip], W[dip]);
        let s = clamp01((ang - CONFIG.fingerAngle.min) / (CONFIG.fingerAngle.max - CONFIG.fingerAngle.min));
        if (d3(W[0], W[tip]) < d3(W[0], W[pip])) s *= 0.4;
        score[name] = s;
      }

      let touch = "none", best = CONFIG.touch;
      for (const [name, tip] of Object.entries(TIPS)) {
        const dd = d3(W[4], W[tip]) / palm;
        if (dd < best) { best = dd; touch = name; }
      }

      const ext = {};
      for (const name of Object.keys(FINGERS)) {
        ext[name] = hyst(h.hyst, "f_" + name, score[name], CONFIG.fingerOff, CONFIG.fingerOn);
      }
      if (touch !== "none" && score[touch] < 0.8) ext[touch] = false;

      const acrossDist = Math.min(d3(W[4], W[10]), d3(W[4], W[13]), d3(W[4], W[14])) / palm;
      const across = hyst(h.hyst, "thumbAcross", -acrossDist, -CONFIG.thumbAcrossOff, -CONFIG.thumbAcrossOn);
      const outRatio = d3(W[4], W[6]) / palm;
      const thumbPos = across ? "across" : (outRatio > CONFIG.thumbOut ? "out" : "side");
      ext.thumb = thumbPos !== "across";
      const thumb = ext.thumb ? 1 : 0;

      const vals = Object.values(score);
      const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
      const shape = (avg > CONFIG.curvedAvg.min && avg < CONFIG.curvedAvg.max && Math.max(...vals) < 0.85)
        ? "curved" : "none";

      const hookIndex = score.index > 0.2 && score.index < 0.62 &&
        score.middle < 0.2 && score.ring < 0.2 && score.pinky < 0.2;

      const spreadRatio = d3(W[8], W[12]) / (d3(W[5], W[9]) || 1e-6);
      const spread = spreadRatio > CONFIG.spreadApart ? "apart" : "together";

      const key = `[${thumb}, ${+ext.index}, ${+ext.middle}, ${+ext.ring}, ${+ext.pinky}]`;

      return {
        key, thumbPos, touch, shape, hookIndex, spread, ext,
        handDir:  dirOf(I, 0, 9, vw, vh),
        thumbDir: dirOf(I, 2, 4, vw, vh),
        indexDir: dirOf(I, 5, 8, vw, vh),
        _scores: score
      };
    }

    // ------------------------------------------------------------------
    // Gesture lookup (see gestures.json)
    // ------------------------------------------------------------------
    function matches(when, f) {
      return Object.entries(when).every(([k, v]) =>
        Array.isArray(v) ? v.includes(f[k]) : f[k] === v);
    }

    function flipThumb(key) {
      return key.slice(0, 1) + (key[1] === "1" ? "0" : "1") + key.slice(2);
    }

    const rulesOf = (k) => gestureDictionary[k] || [];

    function lookupGesture(f) {
      const keys = [f.key];
      if (f.touch !== "none") keys.push(flipThumb(f.key));

      for (const r of rulesOf("*")) if (r.when && matches(r.when, f)) return r;
      for (const k of keys) {
        for (const r of rulesOf(k)) if (r.when && matches(r.when, f)) return r;
      }
      for (const r of rulesOf(f.key)) if (!r.when) return r;
      return null;
    }

    // ------------------------------------------------------------------
    // Two-hand features and lookup
    // ------------------------------------------------------------------
    // "left" / "right" are the two hands as you see them on screen (mirrored view),
    // so "left" is your left hand when your arms are not crossed.
    function pairFeatures(h0, h1, pairMotion = "none", sayA = null, sayB = null) {
      const a = h0.sample, b = h1.sample;
      sayA = sayA ?? (h0.rule ? h0.rule.say : null);
      sayB = sayB ?? (h1.rule ? h1.rule.say : null);
      const aIsLeft = a.palm.x <= b.palm.x;
      const left = aIsLeft ? sayA : sayB;
      const right = aIsLeft ? sayB : sayA;
      const S = (a.scale + b.scale) / 2 || 1;
      const d = Math.hypot(a.palm.x - b.palm.x, a.palm.y - b.palm.y) / S;
      const P = CONFIG.pair;
      const gap = d < P.gapOverlap ? "overlap" : d < P.gapNear ? "near" : "far";
      const dy = (a.palm.y - b.palm.y) / S;           // negative: hand A is higher
      let above = "level";
      if (dy < -0.5) above = aIsLeft ? "left" : "right";
      else if (dy > 0.5) above = aIsLeft ? "right" : "left";
      return { left, right, gap, above, pairMotion };
    }

    function matchesPair(rule, pf) {
      const when = rule.when || {};
      if (matches(when, pf)) return true;
      if (rule.sym === false) return false;
      const swapped = { ...pf, left: pf.right, right: pf.left,
        above: pf.above === "left" ? "right" : pf.above === "right" ? "left" : "level" };
      return matches(when, swapped);
    }

    function lookupPairStatic(pf) {
      for (const r of gestureDictionary.pairs) {
        if (r.when && !r.when.pairMotion && matchesPair(r, pf)) return r;
      }
      return null;
    }

    function lookupPairMotion(pf) {
      for (const r of gestureDictionary.pairs) {
        if (r.when && r.when.pairMotion && matchesPair(r, pf)) return r;
      }
      return null;
    }

    // ------------------------------------------------------------------
    // Sentence composer
    // ------------------------------------------------------------------
    const sentence = { words: [], spelling: "", lastSpellAt: 0 };

    function flushSpelling() {
      if (sentence.spelling) {
        sentence.words.push({ text: sentence.spelling, kind: "spelled" });
        sentence.spelling = "";
      }
    }

    function composeText() {
      const parts = sentence.words.map(w => w.kind === "spelled" ? w.text.toLowerCase() : w.text);
      if (sentence.spelling) parts.push(sentence.spelling.toLowerCase());
      const s = parts.join(" ").replace(/\bi\b/g, "I");
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function renderSentence(popLast = false) {
      sentenceEl.textContent = "";
      const { words, spelling } = sentence;
      if (!words.length && !spelling) {
        const p = document.createElement("span");
        p.className = "placeholder";
        p.textContent = "Spell a word or sign a phrase. Hold each sign for a moment.";
        sentenceEl.appendChild(p);
      } else {
        words.forEach((w, i) => {
          const el = document.createElement("span");
          el.className = "tok " + (w.kind === "spelled" ? "spelled" : "whole");
          if (popLast && !spelling && i === words.length - 1) el.classList.add("pop");
          el.textContent = w.text;
          sentenceEl.appendChild(el);
        });
        if (spelling) {
          const el = document.createElement("span");
          el.className = "tok live";
          el.textContent = spelling;
          sentenceEl.appendChild(el);
        }
      }
      const empty = !words.length && !spelling;
      $("btn-speak").disabled = empty || !("speechSynthesis" in window);
      $("btn-copy").disabled = empty;
      $("btn-back").disabled = empty;
      $("btn-clear").disabled = empty;
    }

    function addToken(rule) {
      if (rule.kind === "letter" || rule.kind === "number") {
        sentence.spelling += rule.say;
        sentence.lastSpellAt = performance.now();
        renderSentence();
      } else {
        flushSpelling();
        sentence.words.push({ text: rule.say, kind: "word" });
        renderSentence(true);
      }
      ringEl.classList.remove("flash");
      void ringEl.offsetWidth;
      ringEl.classList.add("flash");
      if (DEBUG) console.log("added", rule.say);
    }

    function undoToken() {
      if (sentence.spelling) sentence.spelling = sentence.spelling.slice(0, -1);
      else sentence.words.pop();
      renderSentence();
    }

    $("btn-space").addEventListener("click", () => { flushSpelling(); renderSentence(); });
    $("btn-back").addEventListener("click", undoToken);
    $("btn-clear").addEventListener("click", () => { sentence.words = []; sentence.spelling = ""; renderSentence(); });
    $("btn-speak").addEventListener("click", () => {
      flushSpelling();
      renderSentence();
      const text = composeText();
      if (!text || !("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      speechSynthesis.speak(new SpeechSynthesisUtterance(text));
    });
    $("btn-copy").addEventListener("click", async () => {
      const btn = $("btn-copy");
      try {
        await navigator.clipboard.writeText(composeText());
        btn.textContent = "Copied";
      } catch (err) {
        btn.textContent = "Copy failed";
      }
      setTimeout(() => { btn.textContent = "Copy"; }, 1200);
    });
    document.addEventListener("keydown", (e) => {
      const onButton = e.target instanceof HTMLElement && e.target.tagName === "BUTTON";
      if (e.key === "Backspace") { e.preventDefault(); undoToken(); }
      else if (e.key === "Escape") $("btn-clear").click();
      else if (e.key === "Enter" && !onButton) $("btn-speak").click();
      else if (e.key === " " && !onButton) { e.preventDefault(); flushSpelling(); renderSentence(); }
    });
    setInterval(() => {
      if (sentence.spelling && performance.now() - sentence.lastSpellAt > CONFIG.hold.wordGapMs) {
        flushSpelling();
        renderSentence();
      }
    }, 300);

    // ------------------------------------------------------------------
    // Sign guide
    // ------------------------------------------------------------------
    let guideTab = "letters";
    let guideItems = [];

    function buildGuide() {
      const seen = new Set();
      const items = [];
      const push = (r, how, pair = false) => {
        const id = (pair ? "pair:" : "") + how + ":" + r.say;
        if (seen.has(id)) return;
        seen.add(id);
        items.push({ say: r.say, kind: r.kind, hint: r.hint || r.label, how, pair });
      };
      for (const [k, list] of Object.entries(gestureDictionary)) {
        if (!RESERVED.has(k)) list.forEach(r => push(r, "hold"));
      }
      gestureDictionary.motions.forEach(r => push(r, "motion"));
      gestureDictionary.pairs.forEach(r => push(r, r.when && r.when.pairMotion ? "motion" : "hold", true));
      guideItems = items;
      renderGuide();
    }

    function renderGuide() {
      guideBody.textContent = "";
      $("legend").hidden = guideTab !== "words";
      const list = guideItems.filter(i => guideTab === "letters" ? i.kind !== "word" : i.kind === "word");
      if (guideTab === "letters") {
        list.sort((a, b) => (a.kind === b.kind
          ? a.say.localeCompare(b.say, undefined, { numeric: true })
          : a.kind === "letter" ? -1 : 1));
      }
      for (const item of list) {
        const tile = document.createElement("div");
        tile.className = "tile" + (item.pair ? " pair" : item.how === "motion" ? " motion" : "");
        if (item.how === "motion") tile.dataset.motion = "1";
        tile.dataset.say = item.say;
        const glyph = document.createElement("span");
        glyph.className = "glyph" + (item.kind === "word" ? " word" : "");
        glyph.textContent = item.say;
        const how = document.createElement("span");
        how.className = "how";
        how.textContent = item.hint;
        tile.append(glyph, how);
        guideBody.appendChild(tile);
      }
    }

    document.querySelectorAll(".tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        guideTab = btn.dataset.tab;
        document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b === btn)));
        renderGuide();
      });
    });

    function markLive(say) {
      guideBody.querySelectorAll(".tile.live").forEach(el => el.classList.remove("live"));
      if (!say) return;
      guideBody.querySelectorAll(".tile").forEach(el => {
        if (el.dataset.say === say && !el.dataset.motion) el.classList.add("live");
      });
    }

    // ------------------------------------------------------------------
    // Readout: debounced static gesture
    // ------------------------------------------------------------------
    let shownState = null;
    let shownRule = null;
    let pendingState = null;
    let pendingCount = 0;
    let lastLoggedKey = "";
    let lastDebugTime = 0;

    function render(state, rule) {
      textOutput.innerText = state;
      textOutput.dataset.state = state === NOHAND ? "none" : state === UNKNOWN ? "unknown" : "ok";
      markLive(rule ? rule.say : null);
    }

    function commit(state, rule, immediate = false) {
      if (state === shownState) { pendingState = null; pendingCount = 0; return; }
      if (state !== pendingState) { pendingState = state; pendingCount = 1; }
      else pendingCount++;
      if (immediate || shownState === null || pendingCount >= CONFIG.stableFrames) {
        shownState = state;
        shownRule = rule;
        pendingState = null;
        pendingCount = 0;
        render(state, rule);
      }
    }

    // ------------------------------------------------------------------
    // Hold-to-add
    // ------------------------------------------------------------------
    const RING_C = 2 * Math.PI * 18;
    ringFg.style.strokeDasharray = RING_C;
    ringFg.style.strokeDashoffset = RING_C;
    let lastHint = "";
    let suppressUntil = 0;
    const hold = { label: null, since: 0, committed: false, commitAt: 0 };

    function setRing(progress, done) {
      ringFg.style.strokeDashoffset = RING_C * (1 - clamp01(progress));
      ringEl.dataset.done = done ? "1" : "0";
    }
    function setHint(text) {
      if (text !== lastHint) { lastHint = text; readoutHint.textContent = text; }
    }

    function updateHold(now, moving, hasHand) {
      const H = CONFIG.hold;
      const rule = hasHand ? shownRule : null;
      const label = rule ? rule.label : null;
      if (label !== hold.label) { hold.label = label; hold.since = now; hold.committed = false; }

      let hint = "", progress = 0, done = false;
      if (!rule) {
        hold.committed = false;
      } else if (now < suppressUntil) {
        hold.since = now; hold.committed = false;
        hint = "Motion sign recognised. Lower your hands to continue.";
      } else if (moving) {
        hold.since = now; hold.committed = false;
        hint = "Moving";
      } else if (!hold.committed) {
        progress = (now - hold.since) / H.holdMs;
        hint = `Hold to add \u201C${rule.say}\u201D`;
        if (progress >= 1) {
          addToken(rule);
          hold.committed = true;
          hold.commitAt = now;
          progress = 1; done = true;
          hint = `Added \u201C${rule.say}\u201D`;
        }
      } else {
        done = true;
        if (rule.kind !== "word") {
          hint = `Added \u201C${rule.say}\u201D. Keep holding to type it again.`;
          progress = (now - hold.commitAt) / H.repeatMs;
          if (progress >= 1) { addToken(rule); hold.commitAt = now; progress = 0; }
        } else {
          hint = `Added \u201C${rule.say}\u201D`;
          progress = 1;
        }
      }
      setRing(progress, done);
      setHint(hint);
    }

    // ------------------------------------------------------------------
    // One-hand motion tracking (runs for each hand)
    // ------------------------------------------------------------------
    const M = CONFIG.motion;
    let lastEvent = { label: null, t: 0 };

    const palmCenter = (I) => {
      const ids = [0, 5, 9, 13, 17];
      return { x: ids.reduce((a, i) => a + I[i].x, 0) / 5, y: ids.reduce((a, i) => a + I[i].y, 0) / 5 };
    };

    function pushSample(h, now, I, vw, vh, say, features) {
      const pc = palmCenter(I);
      const scalePx = Math.hypot((I[0].x - I[9].x) * vw, (I[0].y - I[9].y) * vh) || 1;
      h.scaleEma = h.scaleEma ? h.scaleEma + 0.1 * (scalePx - h.scaleEma) : scalePx;

      // the fingertip that is "writing" (for J and Z), used for the trail too
      const tipId = (features.ext.pinky && !features.ext.index) ? 20 : features.ext.index ? 8 : null;
      const tip = tipId ? I[tipId] : pc;
      const sc = features._scores;
      const sample = {
        t: now,
        scale: h.scaleEma,
        // display coordinates (mirrored so "right" is the user's right on screen)
        palm:  { x: (1 - pc.x) * vw, y: pc.y * vh },
        index: { x: (1 - I[8].x) * vw, y: I[8].y * vh },
        pinky: { x: (1 - I[20].x) * vw, y: I[20].y * vh },
        trail: { x: tip.x, y: tip.y },   // raw normalised, for drawing
        say,
        fingers: [sc.index, sc.middle, sc.ring, sc.pinky]
      };
      h.buffer.push(sample);
      while (h.buffer.length && now - h.buffer[0].t > 3500) h.buffer.shift();
      return sample;
    }

    function updateSpeed(h) {
      const buf = h.buffer;
      const n = buf.length;
      if (n < 2) return h.speedEma;
      const cur = buf[n - 1];
      let ref = buf[0];
      for (let i = n - 2; i >= 0; i--) {
        ref = buf[i];
        if (cur.t - buf[i].t >= 100) break;
      }
      const dt = (cur.t - ref.t) / 1000;
      const raw = dt < 0.03 ? 0 : Math.hypot(cur.palm.x - ref.palm.x, cur.palm.y - ref.palm.y) / cur.scale / dt;
      h.speedEma += 0.5 * (raw - h.speedEma);
      return h.speedEma;
    }

    function resetMotion(h) {
      h.motion.active = false;
      h.motion.samples = [];
      h.motion.stillSince = null;
      h.motion.startCount = 0;
    }

    function updateMotion(h, now, sample, speed) {
      const m = h.motion;
      if (!m.active) {
        m.startCount = speed > M.startSpeed ? m.startCount + 1 : 0;
        if (m.startCount >= 2) {
          m.active = true;
          m.stillSince = null;
          m.samples = h.buffer.filter(s => s.t >= now - 250);
        }
        return;
      }
      m.samples.push(sample);
      if (speed < M.stopSpeed) {
        if (m.stillSince === null) m.stillSince = now;
        else if (now - m.stillSince > M.stopMs) finishMotion(h);
      } else {
        m.stillSince = null;
      }
      if (m.active && now - m.samples[0].t > M.maxMs) finishMotion(h);
    }

    function finishMotion(h) {
      const m = h.motion;
      if (!m.samples.length) { resetMotion(h); return; }
      const endT = m.stillSince ?? m.samples[m.samples.length - 1].t;
      const segment = m.samples.filter(s => s.t <= endT);
      resetMotion(h);
      const mf = analyzeMotion(segment);
      if (!mf) return;
      const rule = findMotionRule(mf, segment);
      if (DEBUG) console.log("hand", h.id, "motion", JSON.stringify(mf), "->", rule ? rule.label : "no match");
      if (rule) emitRule(rule, h);
    }

    // Fires a recognised motion sign. A one-hand sign is dropped if the other hand has
    // been moving too (that is the two-hand motion detector's job).
    function emitRule(rule, h = null) {
      const now = performance.now();
      if (h && hands.some(o => o !== h && o.active && now - o.lastMovingAt < 500)) return;
      if (rule.label === lastEvent.label && now - lastEvent.t < M.repeatBlockMs) { lastEvent.t = now; return; }
      lastEvent = { label: rule.label, t: now };
      suppressUntil = now + CONFIG.hold.afterMotionMs;
      motionToast.textContent = rule.say;
      motionToast.classList.remove("show");
      void motionToast.offsetWidth;
      motionToast.classList.add("show");
      addToken(rule);
    }

    // ----- path analysis -----
    function countSwings(vals, minAmp) {
      let lastExt = vals[0], dir = 0, count = 0;
      for (const v of vals) {
        if (dir === 0) {
          if (v - lastExt > minAmp) { dir = 1; lastExt = v; }
          else if (lastExt - v > minAmp) { dir = -1; lastExt = v; }
        } else if (dir === 1) {
          if (v > lastExt) lastExt = v;
          else if (lastExt - v > minAmp) { count++; dir = -1; lastExt = v; }
        } else {
          if (v < lastExt) lastExt = v;
          else if (v - lastExt > minAmp) { count++; dir = 1; lastExt = v; }
        }
      }
      return count;
    }

    function circleInfo(pts) {
      const cx = pts.reduce((a, p) => a + p.x, 0) / pts.length;
      const cy = pts.reduce((a, p) => a + p.y, 0) / pts.length;
      let prev = Math.atan2(pts[0].y - cy, pts[0].x - cx), total = 0, r = 0;
      for (let i = 0; i < pts.length; i++) {
        const a = Math.atan2(pts[i].y - cy, pts[i].x - cx);
        let d = a - prev;
        while (d > Math.PI) d -= 2 * Math.PI;
        while (d < -Math.PI) d += 2 * Math.PI;
        total += d;
        prev = a;
        r += Math.hypot(pts[i].x - cx, pts[i].y - cy);
      }
      return { turn: total, radius: r / pts.length };
    }

    function modeOf(samples, key) {
      const tally = {};
      for (const s of samples) if (s[key]) tally[s[key]] = (tally[s[key]] || 0) + 1;
      return Object.entries(tally).sort((a, b) => b[1] - a[1])[0]?.[0] ?? null;
    }

    function analyzeMotion(samples) {
      if (samples.length < 6) return null;
      const dur = samples[samples.length - 1].t - samples[0].t;
      if (dur < M.minMs) return null;

      const S = samples.reduce((a, s) => a + s.scale, 0) / samples.length || 1;
      const pts = samples.map(s => ({ x: s.palm.x / S, y: s.palm.y / S }));
      const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
      let L = 0;
      for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      const rangeX = range(xs);
      const rangeY = range(ys);
      const dx = pts[pts.length - 1].x - pts[0].x;
      const dy = pts[pts.length - 1].y - pts[0].y;
      const net = Math.hypot(dx, dy);
      const swingsX = countSwings(xs, M.swingAmp);
      const swingsY = countSwings(ys, M.swingAmp);

      let kind = "other", spin = null;
      if (L >= M.minPath) {
        const circ = circleInfo(pts);
        const aspect = Math.min(rangeX, rangeY) / Math.max(rangeX, rangeY, 1e-6);
        if (Math.abs(circ.turn) >= M.minCircleTurn && circ.radius > 0.2 && aspect > 0.4) {
          kind = "circle"; spin = circ.turn > 0 ? "cw" : "ccw";
        } else if (swingsX >= 2 && rangeX >= 1.2 * rangeY) kind = "waveX";
        else if (swingsY >= 2 && rangeY >= 1.2 * rangeX) kind = "shakeY";
        else if (net >= M.minSwipe && net / L > 0.65) {
          kind = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "swipeRight" : "swipeLeft") : (dy < 0 ? "swipeUp" : "swipeDown");
        }
      }

      return { motion: kind, spin, hand: modeOf(samples, "say"), flap: "none", path: +L.toFixed(2), swingsX, swingsY };
    }

    // ----- path templates (J, Z): resample, normalise, compare -----
    const pathLen = (pts) => {
      let l = 0;
      for (let i = 1; i < pts.length; i++) l += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      return l;
    };

    function resample(pts, n) {
      const total = pathLen(pts);
      if (total === 0) return null;
      const step = total / (n - 1);
      const src = pts.slice();
      const out = [src[0]];
      let D = 0;
      for (let i = 1; i < src.length; i++) {
        const d = Math.hypot(src[i].x - src[i - 1].x, src[i].y - src[i - 1].y);
        if (d > 0 && D + d >= step) {
          const t = (step - D) / d;
          const q = { x: src[i - 1].x + t * (src[i].x - src[i - 1].x), y: src[i - 1].y + t * (src[i].y - src[i - 1].y) };
          out.push(q);
          src.splice(i, 0, q);
          D = 0;
        } else D += d;
      }
      while (out.length < n) out.push(src[src.length - 1]);
      return out.slice(0, n);
    }

    function normalizePath(raw) {
      const r = resample(raw, CONFIG.template.points);
      if (!r) return null;
      const cx = mean(r.map(p => p.x));
      const cy = mean(r.map(p => p.y));
      const s = Math.max(range(r.map(p => p.x)), range(r.map(p => p.y))) || 1;
      return r.map(p => ({ x: (p.x - cx) / s, y: (p.y - cy) / s }));
    }

    const pathDist = (a, b) => a.reduce((sum, p, i) => sum + Math.hypot(p.x - b[i].x, p.y - b[i].y), 0) / a.length;

    function templateDistance(samples, rule) {
      const raw = samples.map(s => s[rule.track || "palm"]);
      const S = samples.reduce((a, s) => a + s.scale, 0) / samples.length || 1;
      if (pathLen(raw) / S < 0.6) return Infinity;
      const cand = normalizePath(raw);
      if (!cand) return Infinity;
      rule._tpl = rule._tpl || normalizePath(rule.path.map(([x, y]) => ({ x, y })));
      let d = pathDist(cand, rule._tpl);
      if (rule.mirrorOk !== false) {
        d = Math.min(d, pathDist(cand, rule._tpl.map(p => ({ x: -p.x, y: p.y }))));
      }
      return d;
    }

    function findMotionRule(mf, samples) {
      let best = null, bestD = Infinity;
      for (const r of gestureDictionary.motions) {
        if (!r.path || !matches(r.when || {}, mf)) continue;
        const d = templateDistance(samples, r);
        if (DEBUG) console.log("template", r.label, d.toFixed(3));
        if (d < (r.maxDist ?? CONFIG.template.maxDist) && d < bestD) { best = r; bestD = d; }
      }
      if (best) return best;
      for (const r of gestureDictionary.motions) {
        if (!r.path && r.when && matches(r.when, mf)) return r;
      }
      return null;
    }

    // ----- finger flapping (bye, come here) -----
    function countCloses(vals, hi, lo) {
      let state = null, closes = 0;
      for (const v of vals) {
        if (v >= hi) state = 1;
        else if (v <= lo && state === 1) { closes++; state = 0; }
      }
      return closes;
    }

    function updateFlap(h, now, sample, speed) {
      const F = CONFIG.flap;
      h.fingerHist.push({ t: now, s: sample.fingers });
      while (h.fingerHist.length && now - h.fingerHist[0].t > F.windowMs) h.fingerHist.shift();
      if (now < h.flapCooldownUntil || h.motion.active || speed > F.maxSpeed || h.fingerHist.length < 12) return;

      const closes = [0, 1, 2, 3].map(i => countCloses(h.fingerHist.map(x => x.s[i]), F.high, F.low));
      const flapping = closes.map(c => c >= F.minCloses);
      let flap = null;
      if (flapping.every(Boolean)) flap = "all";
      else if (flapping[0] && closes[1] < 1 && closes[2] < 1 && closes[3] < 1) flap = "index";
      if (!flap) return;

      h.fingerHist.length = 0;
      h.flapCooldownUntil = now + F.cooldownMs;
      const mf = { motion: "none", spin: null, hand: null, flap };
      const rule = gestureDictionary.motions.find(r => !r.path && r.when && matches(r.when, mf));
      if (DEBUG) console.log("hand", h.id, "flap", flap, "->", rule ? rule.label : "no match");
      if (rule) emitRule(rule, h);
    }

    // ------------------------------------------------------------------
    // Two-hand motion: 6-7 (alternating), clap, apart, together
    // ------------------------------------------------------------------
    const pair = { buf: [], cooldownUntil: 0 };

    function updatePair(now, h0, h1) {
      const P = CONFIG.pair;
      const a = h0.sample, b = h1.sample;
      const S = (a.scale + b.scale) / 2 || 1;
      pair.buf.push({
        t: now,
        d: Math.hypot(a.palm.x - b.palm.x, a.palm.y - b.palm.y) / S,
        yA: a.palm.y / S,
        yB: b.palm.y / S,
        sA: h0.rule ? h0.rule.say : null,
        sB: h1.rule ? h1.rule.say : null
      });
      while (pair.buf.length && now - pair.buf[0].t > 2500) pair.buf.shift();
      if (now < pair.cooldownUntil) return;

      const win = pair.buf.filter(s => s.t >= now - P.windowMs);
      if (win.length < 15) return;
      const yA = win.map(s => s.yA), yB = win.map(s => s.yB), d = win.map(s => s.d);

      let kind = null;
      if (range(yA) >= P.altRange && range(yB) >= P.altRange &&
          countSwings(yA, P.altAmp) >= 2 && countSwings(yB, P.altAmp) >= 2 &&
          correlation(yA, yB) < P.altCorr) {
        kind = "alternate";
      } else if (countSwings(d, P.clapAmp) >= 2 && range(d) >= P.clapRange) {
        kind = "clap";
      } else {
        const recent = win.filter(s => s.t >= now - 700);
        if (recent.length >= 8) {
          const rd = recent.map(s => s.d);
          const delta = rd[rd.length - 1] - rd[0];
          if (Math.abs(delta) >= P.moveDelta && countSwings(rd, 0.4) === 0) kind = delta > 0 ? "apart" : "together";
        }
      }
      if (!kind) return;

      const pf = pairFeatures(h0, h1, kind, modeOf(win, "sA"), modeOf(win, "sB"));
      const rule = lookupPairMotion(pf);
      if (DEBUG) console.log("pair", kind, JSON.stringify(pf), "->", rule ? rule.label : "no match");
      if (rule) {
        pair.cooldownUntil = now + P.cooldownMs;
        pair.buf.length = 0;
        emitRule(rule);
      }
    }

    // ------------------------------------------------------------------
    // Hand slots
    // ------------------------------------------------------------------
    function assignHands(dets) {
      const result = [], takenHands = new Set(), usedDets = new Set();
      const cand = [];
      dets.forEach((d, i) => hands.forEach(h => {
        if (h.active && h.lastPalm) cand.push({ i, h, dist: Math.hypot(d.pc.x - h.lastPalm.x, d.pc.y - h.lastPalm.y) });
      }));
      cand.sort((a, b) => a.dist - b.dist);
      for (const c of cand) {
        if (usedDets.has(c.i) || takenHands.has(c.h)) continue;
        usedDets.add(c.i); takenHands.add(c.h);
        result.push({ h: c.h, det: dets[c.i] });
      }
      dets.forEach((d, i) => {
        if (usedDets.has(i)) return;
        const free = hands.find(h => !h.active && !takenHands.has(h));
        if (free) { takenHands.add(free); result.push({ h: free, det: d }); }
      });
      return result;
    }

    function processHand(h, det, now, vw, vh) {
      h.present = true;
      h.lostSince = null;
      h.landmarks = det.lm;
      h.lastPalm = det.pc;
      if (!h.active) { h.active = true; h.appearedAt = now; }

      h.smoothW = ema(h.smoothW, det.world, CONFIG.smoothing);
      h.smoothI = ema(h.smoothI, det.lm, CONFIG.smoothing);
      h.features = extractFeatures(h, h.smoothW, h.smoothI, vw, vh);
      h.rule = lookupGesture(h.features);
      h.sample = pushSample(h, now, h.smoothI, vw, vh, h.rule ? h.rule.say : null, h.features);
      h.speed = updateSpeed(h);
      if (h.speed > CONFIG.hold.stillSpeed || h.motion.active) h.lastMovingAt = now;
      updateMotion(h, now, h.sample, h.speed);
      updateFlap(h, now, h.sample, h.speed);

      if (DEBUG && now - lastDebugTime > 250) {
        lastDebugTime = now;
        console.log("hand", h.id, JSON.stringify(h.features, (k, v) =>
          k === "_scores" ? undefined : typeof v === "number" ? Math.round(v * 100) / 100 : v));
      }
    }

    function pickLead(act) {
      if (act.length === 1) return act[0];
      const mode = CONFIG.leadHand;
      if (mode === "left") return act.reduce((a, b) => (a.sample.palm.x <= b.sample.palm.x ? a : b));
      if (mode === "right") return act.reduce((a, b) => (a.sample.palm.x >= b.sample.palm.x ? a : b));
      return act.reduce((a, b) => (a.appearedAt <= b.appearedAt ? a : b));
    }

    // ------------------------------------------------------------------
    // Drawing: skeleton coloured by finger state, plus the motion trail
    // ------------------------------------------------------------------
    const COL_EXT = "#ffb319";
    const COL_CURL = "rgba(255,255,255,0.55)";
    const COL_PALM = "rgba(255,255,255,0.4)";
    const groupOf = (i) => i === 0 ? "palm" : i <= 4 ? "thumb" : i <= 8 ? "index" : i <= 12 ? "middle" : i <= 16 ? "ring" : "pinky";

    function drawHand(landmarks, ext) {
      const w = canvasElement.width, h = canvasElement.height;
      canvasCtx.lineCap = "round";
      canvasCtx.lineWidth = 3.5;
      for (const { start, end } of HandLandmarker.HAND_CONNECTIONS) {
        const g1 = groupOf(start), g2 = groupOf(end);
        const same = g1 === g2 && g1 !== "palm";
        const on = same && ext[g1];
        canvasCtx.strokeStyle = !same ? COL_PALM : on ? COL_EXT : COL_CURL;
        canvasCtx.shadowColor = on ? COL_EXT : "transparent";
        canvasCtx.shadowBlur = on ? 10 : 0;
        canvasCtx.beginPath();
        canvasCtx.moveTo(landmarks[start].x * w, landmarks[start].y * h);
        canvasCtx.lineTo(landmarks[end].x * w, landmarks[end].y * h);
        canvasCtx.stroke();
      }
      canvasCtx.shadowBlur = 0;
      landmarks.forEach((p, i) => {
        const g = groupOf(i);
        const isTip = i === 4 || i === 8 || i === 12 || i === 16 || i === 20;
        const on = g !== "palm" && ext[g];
        canvasCtx.fillStyle = on ? COL_EXT : "#ffffff";
        canvasCtx.beginPath();
        canvasCtx.arc(p.x * w, p.y * h, isTip ? 5.5 : 3, 0, Math.PI * 2);
        canvasCtx.fill();
        if (isTip) {
          canvasCtx.strokeStyle = "rgba(19,21,31,0.7)";
          canvasCtx.lineWidth = 1.5;
          canvasCtx.stroke();
        }
      });
    }

    function drawTrail(h, now) {
      const w = canvasElement.width, ch = canvasElement.height;
      const span = 700;
      const active = h.motion.active;
      canvasCtx.lineCap = "round";
      for (let i = 1; i < h.buffer.length; i++) {
        const a = h.buffer[i - 1], b = h.buffer[i];
        const age = now - b.t;
        if (age > span) continue;
        const alpha = 1 - age / span;
        canvasCtx.strokeStyle = active ? `rgba(255,255,255,${alpha})` : `rgba(143,160,255,${alpha * 0.8})`;
        canvasCtx.shadowColor = active ? "rgba(51,70,255,0.9)" : "transparent";
        canvasCtx.shadowBlur = active ? 12 : 0;
        canvasCtx.lineWidth = (active ? 3 : 2) + alpha * 4;
        canvasCtx.beginPath();
        canvasCtx.moveTo(a.trail.x * w, a.trail.y * ch);
        canvasCtx.lineTo(b.trail.x * w, b.trail.y * ch);
        canvasCtx.stroke();
      }
      canvasCtx.shadowBlur = 0;
    }

    // thin dashed link between the two palms while both hands are in view
    function drawLink(h0, h1) {
      const w = canvasElement.width, ch = canvasElement.height;
      canvasCtx.save();
      canvasCtx.setLineDash([6, 8]);
      canvasCtx.strokeStyle = "rgba(255,255,255,0.35)";
      canvasCtx.lineWidth = 2;
      canvasCtx.beginPath();
      canvasCtx.moveTo(h0.lastPalm.x * w, h0.lastPalm.y * ch);
      canvasCtx.lineTo(h1.lastPalm.x * w, h1.lastPalm.y * ch);
      canvasCtx.stroke();
      canvasCtx.restore();
    }

    function setChip(chip, on, text) {
      const label = chip.querySelector("span");
      const flag = on ? "1" : "0";
      if (chip.dataset.on !== flag) chip.dataset.on = flag;
      if (label.textContent !== text) label.textContent = text;
    }

    // ------------------------------------------------------------------
    // Main loop
    // ------------------------------------------------------------------
    function toPseudoWorld(landmarks, vw, vh) {
      return landmarks.map(p => ({ x: p.x * vw, y: p.y * vh, z: (p.z || 0) * vw }));
    }

    async function predictWebcam() {
      if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
        lastVideoTime = video.currentTime;

        const now = performance.now();
        const results = handLandmarker.detectForVideo(video, now);
        const vw = video.videoWidth || 640;
        const vh = video.videoHeight || 480;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        // 1. match detections to the two hand slots and update each hand
        hands.forEach(h => { h.present = false; });
        const dets = (results.landmarks || []).map((lm, i) => ({
          lm,
          world: (results.worldLandmarks && results.worldLandmarks[i]) || toPseudoWorld(lm, vw, vh),
          pc: palmCenter(lm)
        }));
        for (const { h, det } of assignHands(dets)) processHand(h, det, now, vw, vh);

        // 2. hands that disappeared: keep them briefly, then reset
        for (const h of hands) {
          if (!h.active || h.present) continue;
          if (h.lostSince === null) h.lostSince = now;
          if (now - h.lostSince > CONFIG.handLostGraceMs) {
            if (h.motion.active) finishMotion(h);
            Object.assign(h, newHand(h.id));
            pair.buf.length = 0;
          }
        }

        // 3. draw
        const present = hands.filter(h => h.present);
        present.forEach(h => { drawTrail(h, now); });
        if (present.length === 2) drawLink(present[0], present[1]);
        present.forEach(h => { drawHand(h.landmarks, h.features.ext); });

        // 4. two-hand motion
        if (present.length === 2) updatePair(now, hands[0], hands[1]);

        // 5. pick what the readout shows: a two-hand sign, else the lead hand's sign
        const act = hands.filter(h => h.active);
        if (!act.length) {
          lastLoggedKey = "";
          suppressUntil = 0;
          commit(NOHAND, null, true);
          updateHold(now, false, false);
          setChip(handChip, false, "No hand");
          setChip(motionChip, false, "Still");
        } else {
          let rule = null;
          if (act.length === 2) rule = lookupPairStatic(pairFeatures(act[0], act[1]));
          const lead = pickLead(act);
          if (!rule) rule = lead.rule;

          if (lead.features.key !== lastLoggedKey) {
            lastLoggedKey = lead.features.key;
            console.log(lead.features.key);
          }

          commit(rule ? rule.label : UNKNOWN, rule);
          const moving = act.some(h => h.motion.active || h.speed > CONFIG.hold.stillSpeed);
          updateHold(now, moving, true);
          setChip(handChip, true, act.length === 2 ? "2 hands" : "1 hand");
          setChip(motionChip, moving, moving ? "Moving" : "Still");
        }

        canvasCtx.restore();
      }

      requestAnimationFrame(predictWebcam);
    }

    renderSentence();
    initializeHandTracker();
  </script>
</body>
